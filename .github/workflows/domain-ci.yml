name: domain-ci

# Reusable CI harness for BLB non-Core domain repositories.
# Extensions are out of scope here — they are mostly private licensee repos.
# A domain repo cannot build alone — it has no composer.json at the
# root, no vendor/, no Laravel bootstrap, and no Pest config. This workflow
# composes the domain against a platform checkout, resolves cross-domain
# dependencies, then runs Pint, Pest (with coverage), and a scoped SonarCloud
# scan. Existing callers remain supported while descriptor-based callers are
# rolled out on immutable workflow refs.
#
# Every supported database driver is a production driver. The `ci` job runs
# the domain suite on SQLite; the `postgres-mirror` job runs the same suite on
# PostgreSQL in parallel (see the job of the same name in tests.yml and
# tests/AGENTS.md "Database Drivers"). Neither lane replaces the other. The two
# jobs share their setup steps verbatim; change them together.

on:
  workflow_call:
    inputs:
      domain-id:
        description: 'Stable ID from scripts/ci/domain-repos.json.'
        required: false
        type: string
        default: ''
      domain-path:
        description: 'Legacy caller mount path. Omit when domain-id is supplied.'
        required: false
        type: string
        default: ''
      platform-repo:
        description: 'Platform repository that owns Base + Core.'
        required: false
        type: string
        default: BelimbingApp/belimbing
      platform-ref:
        description: 'Platform ref. New descriptor-based callers must use an exact commit SHA.'
        required: false
        type: string
        default: main
      sonar-project-key:
        description: 'Legacy caller Sonar project key. Omit when domain-id is supplied.'
        required: false
        type: string
        default: ''
      sonar-organization:
        description: 'Legacy caller Sonar organization. Omit when domain-id is supplied.'
        required: false
        type: string
        default: ''
      php-version:
        required: false
        type: string
        default: '8.5'
      bun-version:
        required: false
        type: string
        default: '1.3.10'
    secrets:
      SONAR_TOKEN:
        description: 'SonarCloud org analysis token. Prefer the BelimbingApp organization secret (scripts/ci/setup-sonar.php); caller workflows pass secrets.SONAR_TOKEN from the org or repo store.'
        required: true

concurrency:
  group: domain-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    environment: Testing
    env:
      DOMAIN_ID: ${{ inputs.domain-id }}
      LEGACY_DOMAIN_PATH: ${{ inputs.domain-path }}
      LEGACY_SONAR_PROJECT_KEY: ${{ inputs.sonar-project-key }}
      LEGACY_SONAR_ORGANIZATION: ${{ inputs.sonar-organization }}

    steps:
      - name: Checkout platform
        uses: actions/checkout@v7 # NOSONAR — well-known GitHub-maintained action; tag pinning is acceptable for internal projects
        with:
          repository: ${{ inputs.platform-repo }}
          ref: ${{ inputs.platform-ref }}

      - name: Checkout domain under test
        uses: actions/checkout@v7 # NOSONAR — well-known GitHub-maintained action; tag pinning is acceptable for internal projects
        with:
          path: source-under-test
          fetch-depth: 0

      - name: Resolve Domain descriptor
        run: |
          php scripts/ci/domain-ci.php validate
          if [ -n "$DOMAIN_ID" ]; then
            php scripts/ci/domain-ci.php resolve \
              --domain-id="$DOMAIN_ID" \
              --caller-repository="$GITHUB_REPOSITORY" \
              --workflow-ref="${{ inputs.platform-ref }}" >> "$GITHUB_ENV"
            DOMAIN_PATH=$(php scripts/ci/domain-ci.php resolve \
              --domain-id="$DOMAIN_ID" \
              --caller-repository="$GITHUB_REPOSITORY" \
              --workflow-ref="${{ inputs.platform-ref }}" | sed -n 's/^DOMAIN_PATH=//p')
            SONAR_PROJECT_KEY=$(jq -r --arg id "$DOMAIN_ID" '.domains[$id].sonar_project_key // empty' scripts/ci/domain-repos.json)
            SONAR_ORGANIZATION=$(jq -r '.sonar_organization // empty' scripts/ci/domain-repos.json)
          else
            DOMAIN_PATH="$LEGACY_DOMAIN_PATH"
            SONAR_PROJECT_KEY="$LEGACY_SONAR_PROJECT_KEY"
            SONAR_ORGANIZATION="$LEGACY_SONAR_ORGANIZATION"
          fi
          test -n "$DOMAIN_PATH"
          test -n "$SONAR_PROJECT_KEY"
          test -n "$SONAR_ORGANIZATION"
          echo "DOMAIN_PATH=$DOMAIN_PATH" >> "$GITHUB_ENV"
          echo "SONAR_PROJECT_KEY=$SONAR_PROJECT_KEY" >> "$GITHUB_ENV"
          echo "SONAR_ORGANIZATION=$SONAR_ORGANIZATION" >> "$GITHUB_ENV"
          mkdir -p "$(dirname "$DOMAIN_PATH")"
          mv source-under-test "$DOMAIN_PATH"

      - name: Compose exact cross-domain dependencies
        run: |
          php scripts/ci/compose-domain.php --domain-path="$DOMAIN_PATH" --exact > extra-repos.tsv
          while IFS=$'\t' read -r repo path; do
            [ -z "$repo" ] && continue
            ref=$(jq -r --arg repo "$repo" '.domains[] | select(.repo == $repo) | .ref' scripts/ci/domain-repos.json)
            [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
            echo "Materializing $repo@$ref -> $path"
            git clone --filter=blob:none --no-checkout "https://github.com/${repo}.git" "$path"
            git -C "$path" checkout --detach "$ref"
            printf '%s\t%s\t%s\n' "$repo" "$ref" "$path" >> materialization.tsv
          done < extra-repos.tsv
          printf '%s\t%s\t%s\n' "BelimbingApp/belimbing" "${{ inputs.platform-ref }}" "." >> materialization.tsv
          printf '%s\t%s\t%s\n' "${{ github.repository }}" "${{ github.sha }}" "$DOMAIN_PATH" >> materialization.tsv

      - name: Upload materialization plan
        uses: actions/upload-artifact@v7
        with:
          name: domain-materialization
          path: materialization.tsv

      - name: Setup PHP
        uses: shivammathur/setup-php@v2 # NOSONAR — well-known community PHP action; tag pinning is acceptable for internal projects
        with:
          php-version: ${{ inputs.php-version }}
          extensions: pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: xdebug

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2 # NOSONAR — well-known community Bun action; tag pinning is acceptable for internal projects
        with:
          bun-version: ${{ inputs.bun-version }}
          no-cache: true

      - name: Install JS Dependencies
        run: bun install --frozen-lockfile

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Configure Database for Testing
        run: |
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=:memory:/' .env
          sed -i 's/value="pgsql"/value="sqlite"/' phpunit.xml
          sed -i 's/value="blb"/value=":memory:"/' phpunit.xml

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: bun run build

      - name: Run Pint
        run: vendor/bin/pint --test "$DOMAIN_PATH"

      - name: Run Tests
        run: ./vendor/bin/pest "$DOMAIN_PATH" --coverage-clover=coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8 # NOSONAR — official SonarSource scanner action; tag pinning is acceptable for internal projects
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.sources=${{ env.DOMAIN_PATH }}
            -Dsonar.tests=${{ env.DOMAIN_PATH }}
            -Dsonar.test.inclusions=${{ env.DOMAIN_PATH }}/**/Tests/**
            -Dsonar.php.coverage.reportPaths=coverage.xml
            -Dsonar.cpd.exclusions=${{ env.DOMAIN_PATH }}/**/Tests/**,${{ env.DOMAIN_PATH }}/**/Database/Migrations/**,${{ env.DOMAIN_PATH }}/**/Config/**,${{ env.DOMAIN_PATH }}/**/Routes/**

  postgres-mirror:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Testing
    env:
      DOMAIN_ID: ${{ inputs.domain-id }}
      LEGACY_DOMAIN_PATH: ${{ inputs.domain-path }}
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: blb_domain_mirror
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      BLB_POSTGRES_MIRROR_TESTS: 'true'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blb_domain_mirror
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d blb_domain_mirror"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout platform
        uses: actions/checkout@v7 # NOSONAR — well-known GitHub-maintained action; tag pinning is acceptable for internal projects
        with:
          repository: ${{ inputs.platform-repo }}
          ref: ${{ inputs.platform-ref }}

      - name: Checkout domain under test
        uses: actions/checkout@v7 # NOSONAR — well-known GitHub-maintained action; tag pinning is acceptable for internal projects
        with:
          path: source-under-test
          fetch-depth: 0

      - name: Resolve Domain descriptor
        run: |
          php scripts/ci/domain-ci.php validate
          if [ -n "$DOMAIN_ID" ]; then
            DOMAIN_PATH=$(php scripts/ci/domain-ci.php resolve \
              --domain-id="$DOMAIN_ID" \
              --caller-repository="$GITHUB_REPOSITORY" \
              --workflow-ref="${{ inputs.platform-ref }}" | sed -n 's/^DOMAIN_PATH=//p')
          else
            DOMAIN_PATH="$LEGACY_DOMAIN_PATH"
          fi
          test -n "$DOMAIN_PATH"
          echo "DOMAIN_PATH=$DOMAIN_PATH" >> "$GITHUB_ENV"
          mkdir -p "$(dirname "$DOMAIN_PATH")"
          mv source-under-test "$DOMAIN_PATH"

      - name: Compose exact cross-domain dependencies
        run: |
          php scripts/ci/compose-domain.php --domain-path="$DOMAIN_PATH" --exact > extra-repos.tsv
          while IFS=$'\t' read -r repo path; do
            [ -z "$repo" ] && continue
            ref=$(jq -r --arg repo "$repo" '.domains[] | select(.repo == $repo) | .ref' scripts/ci/domain-repos.json)
            [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
            git clone --filter=blob:none --no-checkout "https://github.com/${repo}.git" "$path"
            git -C "$path" checkout --detach "$ref"
          done < extra-repos.tsv

      - name: Setup PHP
        uses: shivammathur/setup-php@v2 # NOSONAR — well-known community PHP action; tag pinning is acceptable for internal projects
        with:
          php-version: ${{ inputs.php-version }}
          extensions: pdo_pgsql, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2 # NOSONAR — well-known community Bun action; tag pinning is acceptable for internal projects
        with:
          bun-version: ${{ inputs.bun-version }}
          no-cache: true

      - name: Install JS Dependencies
        run: bun install --frozen-lockfile

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: bun run build

      - name: Run Tests on PostgreSQL
        run: ./vendor/bin/pest "$DOMAIN_PATH"
