name: composed-smoke

# Boot the platform with every pinned Domain mounted and hold the result to
# scripts/ci/composed-surface.json (#600). The platform test suites run with no
# Domain mounted and each Domain's CI mounts only itself plus its exact
# dependencies, so nothing else proves that the pins in
# scripts/ci/domain-repos.json compose into one application: no route
# collision (#570), no duplicate migration name (#117), the expected route
# table. A pin advance that breaks composition fails here, on the PR that
# advances it (#627). Do not add pull_request paths: filters: a required check
# that only runs on descriptor edits leaves every other PR missing that status.
# The nightly schedule (#663) re-runs the same assertion against the pins on
# main and opens or updates one "Composed boot failed" issue on refusal so
# drift between pin advances is visible without waiting for a PR.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Skip the boot; print the Composed boot failed issue body without calling the GitHub Issues API
        required: false
        type: boolean
        default: false

concurrency:
  group: composed-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  composed-smoke:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    env:
      PLATFORM_OPERATOR_COMPANY_NAME: Belimbing CI
      PLATFORM_OPERATOR_COMPANY_CODE: belimbing_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # NOSONAR — well-known GitHub-maintained action; tag pinning is acceptable for internal projects

      - name: Setup PHP
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: shivammathur/setup-php@v2 # NOSONAR — well-known community PHP action; tag pinning is acceptable for internal projects
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none

      - name: Restore dependency cache
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: actions/cache@v6 # NOSONAR — official GitHub action
        with:
          path: vendor
          key: deps-v1-${{ runner.os }}-${{ runner.arch }}-php8.5-composer-${{ hashFiles('composer.lock', 'composer.json') }}

      - name: Install Dependencies
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Configure the application
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          cp .env.example .env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=:memory:/' .env
          php artisan key:generate --force

      # Materializes People and PeopleConnector at the descriptor's exact refs,
      # then re-runs the autoloader so the mounted modules are discoverable.
      - name: Compose the pinned Domains
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          php scripts/ci/composed-smoke.php --scan-only
          php -r 'require "vendor/autoload.php";' >/dev/null
          for id in people people-connector; do
            repo=$(jq -r --arg id "$id" '.domains[$id].repo' scripts/ci/domain-repos.json)
            ref=$(jq -r --arg id "$id" '.domains[$id].ref' scripts/ci/domain-repos.json)
            path=$(jq -r --arg id "$id" '.domains[$id].path' scripts/ci/domain-repos.json)
            [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
            echo "Materializing $repo@$ref -> $path"
            git clone --filter=blob:none --no-checkout "https://github.com/${repo}.git" "$path"
            git -C "$path" checkout --detach "$ref"
          done
          composer dump-autoload --optimize

      - name: Boot the composed application and hold it to the surface
        id: boot
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          set +e
          php scripts/ci/composed-smoke.php >"${RUNNER_TEMP}/composed-smoke.stdout" 2>"${RUNNER_TEMP}/composed-smoke.stderr"
          status=$?
          if [ -s "${RUNNER_TEMP}/composed-smoke.stdout" ]; then
            cat "${RUNNER_TEMP}/composed-smoke.stdout"
          fi
          if [ -s "${RUNNER_TEMP}/composed-smoke.stderr" ]; then
            cat "${RUNNER_TEMP}/composed-smoke.stderr" >&2
          fi
          {
            echo "exit_code=${status}"
            echo "refusal<<COMPOSED_SMOKE_EOF"
            if [ -s "${RUNNER_TEMP}/composed-smoke.stderr" ]; then
              cat "${RUNNER_TEMP}/composed-smoke.stderr"
            elif [ -s "${RUNNER_TEMP}/composed-smoke.stdout" ]; then
              cat "${RUNNER_TEMP}/composed-smoke.stdout"
            else
              echo "composed-smoke: exited ${status} with no output"
            fi
            echo "COMPOSED_SMOKE_EOF"
          } >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Setup Bun
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        uses: oven-sh/setup-bun@v2 # NOSONAR — well-known community Bun action; tag pinning is acceptable for internal projects
        with:
          bun-version: '1.3.10'
          no-cache: true

      - name: Report composed boot refusal
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMPOSED_SMOKE_REFUSAL: ${{ steps.boot.outputs.refusal }}
        run: |
          args=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
            bun scripts/ci/composed-boot-failure-report.ts "${args[@]}"
            exit 0
          fi
          if [ "${{ steps.boot.outputs.exit_code }}" = "0" ]; then
            echo "Composed smoke passed; no refusal issue."
            exit 0
          fi
          bun scripts/ci/composed-boot-failure-report.ts

      - name: Validate pinned Domain freshness
        id: validate-pins
        if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          set +e
          python3 scripts/ci/validate-domain-pins.py >"${RUNNER_TEMP}/domain-pin-validation.txt" 2>&1
          status=$?
          cat "${RUNNER_TEMP}/domain-pin-validation.txt"
          exit "${status}"

      - name: Report stale Domain pins
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            bun scripts/ci/domain-pin-stale-report.ts --dry-run
            exit 0
          fi
          bun scripts/ci/domain-pin-stale-report.ts --warnings-file "${RUNNER_TEMP}/domain-pin-validation.txt"

      - name: Fail when the composed boot refused
        if: ${{ steps.boot.outcome == 'success' && steps.boot.outputs.exit_code != '0' }}
        run: |
          echo "composed-smoke refused (exit ${{ steps.boot.outputs.exit_code }})"
          exit 1
