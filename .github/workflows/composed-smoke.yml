name: composed-smoke

# Boot the platform with every pinned Domain mounted and hold the result to
# scripts/ci/composed-surface.json (#600). The platform test suites run with no
# Domain mounted and each Domain's CI mounts only itself plus its exact
# dependencies, so nothing else proves that the pins in
# scripts/ci/domain-repos.json compose into one application: no route
# collision (#570), no duplicate migration name (#117), the expected route
# table. A pin advance that breaks composition fails here, on the PR that
# advances it.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: composed-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  composed-smoke:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      PLATFORM_OPERATOR_COMPANY_NAME: Belimbing CI
      PLATFORM_OPERATOR_COMPANY_CODE: belimbing_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v7 # NOSONAR — well-known GitHub-maintained action; tag pinning is acceptable for internal projects

      - name: Setup PHP
        uses: shivammathur/setup-php@v2 # NOSONAR — well-known community PHP action; tag pinning is acceptable for internal projects
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none

      - name: Restore dependency cache
        uses: actions/cache@v6 # NOSONAR — official GitHub action
        with:
          path: vendor
          key: deps-v1-${{ runner.os }}-${{ runner.arch }}-php8.5-composer-${{ hashFiles('composer.lock', 'composer.json') }}

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Configure the application
        run: |
          cp .env.example .env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=:memory:/' .env
          php artisan key:generate --force

      # Materializes People and PeopleConnector at the descriptor's exact refs,
      # then re-runs the autoloader so the mounted modules are discoverable.
      - name: Compose the pinned Domains
        run: |
          php scripts/ci/composed-smoke.php --scan-only
          php -r 'require "vendor/autoload.php";' >/dev/null
          for id in people people-connector; do
            repo=$(jq -r --arg id "$id" '.domains[$id].repo' scripts/ci/domain-repos.json)
            ref=$(jq -r --arg id "$id" '.domains[$id].ref' scripts/ci/domain-repos.json)
            path=$(jq -r --arg id "$id" '.domains[$id].path' scripts/ci/domain-repos.json)
            [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
            echo "Materializing $repo@$ref -> $path"
            git clone --filter=blob:none --no-checkout "https://github.com/${repo}.git" "$path"
            git -C "$path" checkout --detach "$ref"
          done
          composer dump-autoload --optimize

      - name: Boot the composed application and hold it to the surface
        run: php scripts/ci/composed-smoke.php
