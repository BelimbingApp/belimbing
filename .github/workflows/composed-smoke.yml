name: composed-smoke

# Boot the platform with every controlled Domain mounted at its main (#600,
# reshaped by #940). The platform test suites run with no Domain mounted and
# each Domain's CI mounts only itself plus its exact dependencies, so nothing
# else proves that the Domains compose into one application: no route
# collision (#570), no duplicate migration name (#117), Domain commands extend
# TenantScopedCommand (#912), Domain routes carry tenant/authz middleware
# (#917), and cross-Domain ownership holds (#917). Each of those is invisible
# to a single Domain's own CI, because one Domain alone never collides with
# anything.
#
# There are no pins and no checked-in route surface (#940). Composing at main
# means a red run here does not say whether the platform or a Domain caused
# it, and cannot be replayed against a fixed past state; in exchange nothing
# goes stale and no one services a pin. Do not add pull_request paths:
# filters: a required check that only runs on some PRs leaves every other PR
# missing that status. The nightly schedule (#663) re-runs the same assertion
# against main and opens or updates one "Composed boot failed" issue on
# refusal, so a break between PRs is visible without waiting for one.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Skip the boot; print the Composed boot failed issue body without calling the GitHub Issues API
        required: false
        type: boolean
        default: false

concurrency:
  group: composed-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  composed-smoke:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    env:
      PLATFORM_OPERATOR_COMPANY_NAME: Belimbing CI
      PLATFORM_OPERATOR_COMPANY_CODE: belimbing_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # NOSONAR — well-known GitHub-maintained action; tag pinning is acceptable for internal projects

      - name: Setup PHP
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: shivammathur/setup-php@v2 # NOSONAR — well-known community PHP action; tag pinning is acceptable for internal projects
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none

      - name: Restore dependency cache
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: actions/cache@v6 # NOSONAR — official GitHub action
        with:
          path: vendor
          key: deps-v1-${{ runner.os }}-${{ runner.arch }}-php8.5-composer-${{ hashFiles('composer.lock', 'composer.json') }}

      - name: Install Dependencies
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Configure the application
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          cp .env.example .env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=:memory:/' .env
          php artisan key:generate --force

      # Materializes every Domain the descriptor lists, each at its default
      # branch, then re-runs the autoloader so the mounted modules are
      # discoverable.
      - name: Compose the Domains
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          php scripts/ci/composed-smoke.php --scan-only
          php -r 'require "vendor/autoload.php";' >/dev/null
          # The materializer walks every candidate owner; a bare clone of
          # the first one has no fallback (#943 review).
          php scripts/ci/domain-registry.php --materialize
          composer dump-autoload --optimize

      - name: Boot the composed application
        id: boot
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          set +e
          php scripts/ci/composed-smoke.php >"${RUNNER_TEMP}/composed-smoke.stdout" 2>"${RUNNER_TEMP}/composed-smoke.stderr"
          status=$?
          if [ -s "${RUNNER_TEMP}/composed-smoke.stdout" ]; then
            cat "${RUNNER_TEMP}/composed-smoke.stdout"
          fi
          if [ -s "${RUNNER_TEMP}/composed-smoke.stderr" ]; then
            cat "${RUNNER_TEMP}/composed-smoke.stderr" >&2
          fi
          {
            echo "exit_code=${status}"
            echo "refusal<<COMPOSED_SMOKE_EOF"
            if [ -s "${RUNNER_TEMP}/composed-smoke.stderr" ]; then
              cat "${RUNNER_TEMP}/composed-smoke.stderr"
            elif [ -s "${RUNNER_TEMP}/composed-smoke.stdout" ]; then
              cat "${RUNNER_TEMP}/composed-smoke.stdout"
            else
              echo "composed-smoke: exited ${status} with no output"
            fi
            echo "COMPOSED_SMOKE_EOF"
          } >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Setup Bun
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        uses: oven-sh/setup-bun@v2 # NOSONAR — well-known community Bun action; tag pinning is acceptable for internal projects
        with:
          bun-version: '1.3.10'
          no-cache: true

      - name: Report composed boot refusal
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMPOSED_SMOKE_REFUSAL: ${{ steps.boot.outputs.refusal }}
        run: |
          args=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
            bun scripts/ci/composed-boot-failure-report.ts "${args[@]}"
            exit 0
          fi
          if [ "${{ steps.boot.outputs.exit_code }}" = "0" ]; then
            echo "Composed smoke passed; no refusal issue."
            exit 0
          fi
          bun scripts/ci/composed-boot-failure-report.ts

      - name: Fail when the composed boot refused
        if: ${{ steps.boot.outcome == 'success' && steps.boot.outputs.exit_code != '0' }}
        run: |
          echo "composed-smoke refused (exit ${{ steps.boot.outputs.exit_code }})"
          exit 1

      # Platform-owned TenantScopedCommand rule over the Domains we ship
      # (#912). Domain CI still runs the same audit against one Domain plus
      # its exact dependencies; this step answers what that cannot: do the
      # Domains, composed together, satisfy the rule? An unconverted Domain
      # command fails here on the PR that introduces it — intentional, not a
      # flake. DomainCommand
      # TenantAudit::isAllowlisted() short-circuits before the tenant_scoped
      # check, so an allowlisted command passes regardless; this step is not
      # proof that the allowlisted set is correct or empty.
      - name: Audit composed Domain command tenant scope
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && steps.boot.outcome == 'success' && steps.boot.outputs.exit_code == '0' }}
        run: php artisan blb:domain-commands --audit

      # Domain route middleware audit over the composed set (#917). Domain
      # CI still runs blb:domain-routes --audit against one Domain plus its
      # exact dependencies; this step answers what that cannot: do the
      # Domains, composed together, leave every required Domain route with
      # tenant assertion and authorization middleware? A bare Domain route
      # fails here on the PR that introduces it. middleware_audit.allowlist
      # short-circuits before the missing-middleware check, so an allowlisted
      # route passes regardless; this step is not proof that the allowlisted
      # set is correct or empty.
      - name: Audit composed Domain route middleware
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && steps.boot.outcome == 'success' && steps.boot.outputs.exit_code == '0' }}
        run: php artisan blb:domain-routes --audit

      # Cross-Domain table and route ownership over the composed set (#917).
      # Domain CI's module-ownership run sees one Domain plus its dependency
      # closure; this step sees every Domain together, so an unrelated
      # Domain pair cannot collide without a run going red.
      - name: Check composed Domain ownership
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && steps.boot.outcome == 'success' && steps.boot.outputs.exit_code == '0' }}
        run: php artisan blb:module-ownership

      # blb:module-check is intentionally not composed here (#917). It is
      # loop-driven per module id in domain-ci.yml and validates one Module's
      # declared capabilities against the catalog — a solo-Domain concern,
      # not a multi-Domain composition one. Domain repositories already run
      # it via workflow_call on their own PRs; routes and ownership are the
      # composed gaps this job closes.
