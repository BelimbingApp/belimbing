name: linter

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # A unique main group also prevents pending-run eviction.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'pr' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    environment: Testing
    steps:
      - uses: actions/checkout@v7 # NOSONAR — well-known GitHub-maintained action; tag pinning is acceptable for internal projects
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2 # NOSONAR — well-known community Bun action; tag pinning is acceptable for internal projects
        with:
          bun-version: '1.3.10'
          no-cache: true

      # #780: audit secrets.* references before anything that installs vendor/.
      - name: Audit workflow secret references
        run: scripts/ci/token-audit.sh

      # Before test-ci-scripts.sh: extension-conformance hermetics need vendor/bin/pint (#822).
      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          bun install --frozen-lockfile

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Validate composed-source descriptors
        run: tests/ci/test-ci-scripts.sh

      - name: AI-team mechanism tests
        run: python3 -m unittest discover -s docs/ai-team/scripts -p 'test_*.py' -v

      - name: Check Changed Tests
        if: github.event_name == 'pull_request'
        run: php scripts/check-changed-tests.php --base="${{ github.event.pull_request.base.sha }}" --head="${{ github.event.pull_request.head.sha }}"

      - name: Refuse direct edits to the docs/ai-team mount
        if: github.event_name == 'pull_request'
        run: scripts/ci/mount-guard.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

      - name: Verify CI workflow contracts
        run: bun test tests/ci/*.test.ts

      - name: Run Larastan on app/Base
        run: vendor/bin/phpstan analyse --memory-limit=2G

      - name: Check platform Livewire action baseline
        env:
          APP_ENV: testing
        run: php artisan blb:livewire-actions --check-baseline=tests/ci/livewire-actions-baselines/platform.json

      - name: Check module feature flag ownership
        run: vendor/bin/phpstan analyse -c phpstan-feature-flags.neon --memory-limit=2G

      - name: Refuse PHPStan baseline growth
        run: bash scripts/ci/phpstan-baseline-gate.sh

      # Non-blocking: surface stale baseline ignores so debt shrinks are visible (#846).
      # Keep reportUnmatchedIgnoredErrors: false in phpstan.neon; this step uses an override.
      - name: Report unmatched PHPStan baseline ignores
        continue-on-error: true
        run: |
          # NEON resolves includes relative to the override file; use an absolute
          # path so /tmp/phpstan-unmatched.neon actually loads the project config.
          cat > /tmp/phpstan-unmatched.neon <<EOF
          includes:
            - ${PWD}/phpstan.neon
          parameters:
            reportUnmatchedIgnoredErrors: true
          EOF
          set +e
          out=$(vendor/bin/phpstan analyse --memory-limit=2G -c /tmp/phpstan-unmatched.neon app/Base 2>&1)
          status=$?
          set -e
          unmatched=$(printf '%s\n' "$out" | grep -c 'ignore.unmatched' || true)
          echo "::notice::PHPStan unmatched baseline ignores: ${unmatched} (exit ${status})"
          printf '%s\n' "$out" | tail -n 40

      - name: Run Pint on changed authorable PHP
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          scripts/ci/changed-authorable-php.sh "$BASE_SHA" "$HEAD_SHA" > /tmp/authorable-php
          if [ -s /tmp/authorable-php ]; then
            xargs -0 vendor/bin/pint --test -- < /tmp/authorable-php
          else
            echo "No changed authorable PHP files."
          fi
