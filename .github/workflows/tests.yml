name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    environment: Testing
    env:
      PLATFORM_OPERATOR_COMPANY_NAME: Belimbing CI
      PLATFORM_OPERATOR_COMPANY_CODE: belimbing_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v7 # NOSONAR — well-known GitHub-maintained action; tag pinning is acceptable for internal projects
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2 # NOSONAR — well-known community PHP action; tag pinning is acceptable for internal projects
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: xdebug

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2 # NOSONAR — well-known community Bun action; tag pinning is acceptable for internal projects
        with:
          bun-version: '1.3.10'
          no-cache: true

      - name: Install JS Dependencies
        run: bun install --frozen-lockfile

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Configure Database for Testing
        run: |
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=:memory:/' .env
          sed -i 's/value="pgsql"/value="sqlite"/' phpunit.xml
          sed -i 's/value="blb"/value=":memory:"/' phpunit.xml

      - name: Configure Framework Primitives for Testing
        run: |
          bootstrap_admin_file="$RUNNER_TEMP/blb-ci-bootstrap-admin.txt"
          printf '%s\n' \
            'Belimbing CI Administrator' \
            'admin@ci.example.test' \
            'testing-only-password' \
            > "$bootstrap_admin_file"
          echo "BLB_BOOTSTRAP_ADMIN_FILE=$bootstrap_admin_file" >> "$GITHUB_ENV"

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Prove changed migration sources match the database
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            ':(glob)app/**/Database/Migrations/**/*.php' \
            'database/migrations/*.php' \
            'app/Base/Database/Services/SchemaDrift/*.php' \
            'app/Base/Database/Console/Commands/SchemaDriftCommand.php'; then
            echo 'Migration source and drift inspector are unchanged.'
          else
            php artisan migrate --force --no-interaction
          fi

      - name: Build Assets
        run: bun run build

      - name: Run Tests
        run: ./vendor/bin/pest

  postgres-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Testing
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: blb_mirror_source
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      MIRROR_TEST_DB_HOST: 127.0.0.1
      MIRROR_TEST_DB_PORT: 5432
      MIRROR_TEST_DB_DATABASE: blb_mirror_target
      MIRROR_TEST_DB_USERNAME: postgres
      MIRROR_TEST_DB_PASSWORD: postgres
      BLB_POSTGRES_MIRROR_TESTS: 'true'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blb_mirror_source
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d blb_mirror_source"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7 # NOSONAR — well-known GitHub-maintained action; tag pinning is acceptable for internal projects

      - name: Setup PHP
        uses: shivammathur/setup-php@v2 # NOSONAR — well-known community PHP action; tag pinning is acceptable for internal projects
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16
          pg_dump --version
          psql --version

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Prove migrations on PostgreSQL
        run: php artisan migrate --force --no-interaction

      - name: Create isolated mirror target
        run: psql --host=127.0.0.1 --username=postgres --dbname=postgres --command='CREATE DATABASE blb_mirror_target'
        env:
          PGPASSWORD: postgres

      - name: Run native and portable mirror integration tests
        run: |
          ./vendor/bin/pest tests/Integration/Database/DevelopmentTableMirrorPostgresTest.php
          DB_CONNECTION=sqlite DB_DATABASE=:memory: ./vendor/bin/pest tests/Integration/Database/PortableDevelopmentTableMirrorTest.php

      - name: Run schedule reservation concurrency tests
        run: ./vendor/bin/pest tests/Integration/Schedule/ScheduleRunReservationConcurrencyTest.php
