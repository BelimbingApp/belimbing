name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    environment: Testing
    env:
      PLATFORM_OPERATOR_COMPANY_NAME: Belimbing CI
      PLATFORM_OPERATOR_COMPANY_CODE: belimbing_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v7 # NOSONAR — well-known GitHub-maintained action; tag pinning is acceptable for internal projects
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2 # NOSONAR — well-known community PHP action; tag pinning is acceptable for internal projects
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: pcov # xdebug's coverage mode aborted the full suite with "zend_mm_heap corrupted" (#537, run 33746514692); pcov is coverage-only and light

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2 # NOSONAR — well-known community Bun action; tag pinning is acceptable for internal projects
        with:
          bun-version: '1.3.10'
          no-cache: true

      - name: Install JS Dependencies
        run: bun install --frozen-lockfile

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      # phpunit.xml has declared sqlite/:memory: since 2026-08-06, so the two
      # phpunit.xml rewrites this step used to carry matched nothing. Only the
      # .env lines do real work, for the artisan commands below.
      - name: Configure Database for Testing
        run: |
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=:memory:/' .env

      - name: Configure Framework Primitives for Testing
        run: |
          bootstrap_admin_file="$RUNNER_TEMP/blb-ci-bootstrap-admin.txt"
          printf '%s\n' \
            'Belimbing CI Administrator' \
            'admin@ci.example.test' \
            'testing-only-password' \
            > "$bootstrap_admin_file"
          echo "BLB_BOOTSTRAP_ADMIN_FILE=$bootstrap_admin_file" >> "$GITHUB_ENV"

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Prove changed migration sources match the database
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            ':(glob)app/**/Database/Migrations/**/*.php' \
            'database/migrations/*.php' \
            'app/Base/Database/Services/SchemaDrift/*.php' \
            'app/Base/Database/Console/Commands/SchemaDriftCommand.php'; then
            echo 'Migration source and drift inspector are unchanged.'
          else
            php artisan migrate --force --no-interaction
          fi

      - name: Build Assets
        run: bun run build

      # Coverage is produced here and read by the SonarCloud scan below.
      # Until that scan existed, the project was analysed by SonarCloud's
      # automatic analysis, which never runs tests, so "coverage on new code"
      # read 0.0% on every PR by construction (#537). A CI-based scan and
      # automatic analysis are mutually exclusive on SonarCloud: this step
      # fails with "automatic analysis is enabled" until the organisation
      # admin turns it off for BelimbingApp_lara.
      - name: Run Tests
        run: ./vendor/bin/pest --coverage-clover=coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8 # NOSONAR — official SonarSource scanner action; tag pinning is acceptable for internal projects
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=BelimbingApp_lara
            -Dsonar.organization=belimbingapp
            -Dsonar.sources=app,resources/core
            -Dsonar.tests=tests
            -Dsonar.php.coverage.reportPaths=coverage.xml

  # Every supported database driver is a production driver; the main job's
  # driver is not a stand-in for "real". This lane exists only for tests whose
  # mechanism needs this driver. Such tests self-skip elsewhere AND must be
  # registered in this job's run steps below - a self-skip alone runs nowhere.
  # Do not replace the main job with it. See tests/AGENTS.md "Database Drivers".
  postgres-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Testing
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: blb_mirror_source
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      MIRROR_TEST_DB_HOST: 127.0.0.1
      MIRROR_TEST_DB_PORT: 5432
      MIRROR_TEST_DB_DATABASE: blb_mirror_target
      MIRROR_TEST_DB_USERNAME: postgres
      MIRROR_TEST_DB_PASSWORD: postgres
      BLB_POSTGRES_MIRROR_TESTS: 'true'
      BLB_POSTGRES_FRESHNESS_TESTS: 'true'
      BLB_FRESHNESS_PG_HOST: 127.0.0.1
      BLB_FRESHNESS_PG_PORT: 5432
      BLB_FRESHNESS_PG_DB: blb_freshness_target
      BLB_FRESHNESS_PG_USER: postgres
      BLB_FRESHNESS_PG_PASS: postgres

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blb_mirror_source
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d blb_mirror_source"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7 # NOSONAR — well-known GitHub-maintained action; tag pinning is acceptable for internal projects

      - name: Setup PHP
        uses: shivammathur/setup-php@v2 # NOSONAR — well-known community PHP action; tag pinning is acceptable for internal projects
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16
          pg_dump --version
          psql --version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2 # NOSONAR — well-known community Bun action; tag pinning is acceptable for internal projects
        with:
          bun-version: '1.3.10'
          no-cache: true

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      # The driver-sensitive list below includes page-rendering tests, because
      # the audit filters, the schedule board and the Geonames lists are where
      # this driver's JSON and string grammar actually executes. Every one of
      # them 500s on a missing Vite manifest.
      - name: Build Assets
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build

      - name: Prove migrations on PostgreSQL
        run: php artisan migrate --force --no-interaction

      - name: Create isolated mirror and freshness targets
        run: |
          psql --host=127.0.0.1 --username=postgres --dbname=postgres --command='CREATE DATABASE blb_mirror_target'
          psql --host=127.0.0.1 --username=postgres --dbname=postgres --command='CREATE DATABASE blb_freshness_target'
        env:
          PGPASSWORD: postgres

      - name: Run native and portable mirror integration tests
        run: |
          ./vendor/bin/pest tests/Integration/Database/DevelopmentTableMirrorPostgresTest.php
          DB_CONNECTION=sqlite DB_DATABASE=:memory: ./vendor/bin/pest tests/Integration/Database/PortableDevelopmentTableMirrorTest.php

      - name: Run schedule concurrency tests
        run: |
          ./vendor/bin/pest tests/Integration/Schedule/ScheduleRunReservationConcurrencyTest.php
          ./vendor/bin/pest tests/Integration/Schedule/ScheduleConfigurationGateConcurrencyTest.php

      - name: Run data-freshness trigger proof
        run: ./vendor/bin/pest tests/Integration/Database/DataFreshnessPostgresTest.php

      # Its own database, because DevelopmentTableMirrorPostgresTest drops
      # tables from the source database it runs against (base_settings among
      # them). Anything sharing blb_mirror_source after that step would fail for
      # that reason rather than for a real one.
      - name: Create isolated driver-sensitive test database
        run: psql --host=127.0.0.1 --username=postgres --dbname=postgres --command='CREATE DATABASE blb_driver_sensitive'
        env:
          PGPASSWORD: postgres

      - name: Migrate the driver-sensitive test database
        env:
          DB_DATABASE: blb_driver_sensitive
        run: php artisan migrate --force --no-interaction

      # RefreshDatabase calls migrate:fresh, whose db:wipe step BLB blocks
      # outside an in-memory SQLite database — so these tests reuse the schema
      # the step above created and rely on their own per-test transaction. That
      # is why the migrate step is not optional and why this is one invocation.
      #
      # Registration is by file name and a typo is silent: the tick stays green
      # and the file simply does not run. The evidence a file runs here is this
      # step's test count moving, not its colour (#533). A file belongs here when
      # what it proves depends on the driver — foreign-key resolution, triggers,
      # constraints — whether or not it self-skips on SQLite.
      - name: Run driver-sensitive tests on PostgreSQL
        env:
          DB_DATABASE: blb_driver_sensitive
          PLATFORM_OPERATOR_COMPANY_NAME: Belimbing CI
          PLATFORM_OPERATOR_COMPANY_CODE: belimbing_ci
        run: |
          ./vendor/bin/pest \
            tests/Feature/Foundation/FrameworkPrimitivesProvisionerTest.php \
            tests/Feature/Database/QueryTest.php \
            tests/Feature/Database/DataShareDiagnosticCaptureTest.php \
            tests/Feature/Database/DataShareDiagnosticImportTest.php \
            tests/Feature/Database/DataShareGenericPackageTest.php \
            tests/Feature/Database/DataShareMirrorBackendTest.php \
            tests/Feature/Database/DataShareMirrorUiTest.php \
            tests/Feature/Database/IncubatingSchemaPreflightTest.php \
            tests/Feature/Schedule/ScheduleCronOverrideTest.php \
            tests/Feature/Schedule/SchedulePageTest.php \
            tests/Feature/Audit/AuditLogUiTest.php \
            tests/Feature/Core/Geonames \
            tests/Unit/Core/AI/Services/TaskModelRecommendationServiceTest.php
